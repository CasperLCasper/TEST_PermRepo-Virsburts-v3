name: PermRepo backup audit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backup-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backup audit tests
        run: npm test
