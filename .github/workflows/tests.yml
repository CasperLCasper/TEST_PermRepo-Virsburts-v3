name: PermRepo backup audit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backup-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run backup audit tests
        run: npm test
        timeout-minutes: 5
