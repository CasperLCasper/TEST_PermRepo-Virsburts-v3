name: Propose package-lock.json updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Generate or update package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json jau ir aktuāls, nav izmaiņu."
            exit 0
          fi

          BRANCH="automation/update-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package-lock.json
          git commit -m "chore: propose package-lock.json update"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: review package-lock.json update" \
            --body "Automātiski sagatavots atkarību lockfile atjauninājums. Pirms merge pārskati visas versiju un integritātes izmaiņas."
